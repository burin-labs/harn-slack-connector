[package]
name = "harn-slack-connector"
version = "0.2.0"
description = "Pure-Harn Slack connector: Events API signatures, URL verification, triage source metadata, Socket Mode, and Web API dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-slack-connector"
harn = ">=0.8,<0.9"

[exports]
default = "src/lib.harn"

[[providers]]
id = "slack"
connector = { harn = "src/lib.harn" }
# `streaming` advertises Socket Mode support, but Socket Mode is OFF by default.
# socket_mode_connect refuses to open a WebSocket unless it is explicitly
# enabled (args.enable_socket_mode / binding / ctx socket_mode.enabled) AND an
# app-level `xapp-` token is present. The default delivery path is HTTP Events.
# socket_mode_connect is never reached from normalize_inbound (CPU-only hot
# path; effect policy denies network there).
capabilities = ["webhook", "oauth", "streaming"]
oauth = { resource = "https://slack.com/api/", authorization_endpoint = "https://slack.com/oauth/v2/authorize", token_endpoint = "https://slack.com/api/oauth.v2.access", scopes = "app_mentions:read chat:write", token_endpoint_auth_method = "client_secret_post" }

[providers.setup]
auth_type = "oauth2"
flow = "browser"
required_scopes = ["app_mentions:read", "chat:write"]
required_secrets = ["slack/signing-secret", "slack/bot-token", "slack/app-token"]
setup_command = ["harn", "connect", "slack"]
validation_command = ["harn", "connect", "status", "--connector", "slack", "--json"]

[[providers.setup.health_checks]]
id = "signing-secret"
kind = "secret"
secret = "slack/signing-secret"

[[providers.setup.health_checks]]
id = "bot-token"
kind = "secret"
secret = "slack/bot-token"

[[providers.setup.health_checks]]
id = "app-token"
kind = "secret"
secret = "slack/app-token"

[providers.setup.recovery]
missing_auth = "Store slack/signing-secret, slack/bot-token, and slack/app-token before enabling Slack bindings."
expired_credentials = "Rotate the Slack app tokens, update stored secrets, and rerun Slack validation."
revoked_credentials = "Reinstall or reauthorize the Slack app, then replace slack/bot-token and slack/app-token."
missing_scopes = "Grant the bot and app scopes required by the configured Slack events and Web API calls."
inaccessible_resource = "Invite or authorize the Slack app for the target workspace, channels, and conversations."
transient_provider_outage = "Retry after Slack API, Events API, or Socket Mode endpoints are healthy."

# Harn-side package dependencies. This package currently has none.
[dependencies]

[connector_contract]
version = 1

# Security: after the 2026-05-23 F10 fix the Slack connector ignores any
# caller-supplied `now` in the raw envelope and verifies request freshness
# against the trusted clock with a 5-minute replay window. The static
# signed-fixture bodies below therefore now demonstrate the replay-window
# rejection — happy-path normalize_inbound behaviour is exercised by the
# tests/normalize_smoke.harn and tests/normalize_events.harn pipelines, which
# sign with `harness.clock.timestamp()` so the signature stays inside the
# window at run time.

[[connector_contract.fixtures]]
provider = "slack"
name = "url verification rejects stale signature"
kind = "webhook"
headers = { "content-type" = "application/json", "x-slack-request-timestamp" = "1713659999", "x-slack-signature" = "v0=c6f5a5568a39a9cb38d1cc2e406ec157ea18f0468d278125104bdb44a5c7858c" }
metadata = { signing_secret = "event-secret", binding_id = "contract-slack-webhook", binding_version = 1, path = "/slack/events" }
body = '''{"token":"legacy-token","challenge":"challenge-abc-123","type":"url_verification"}'''
expect_type = "reject"
expect_response_status = 403
expect_event_count = 0

[[connector_contract.fixtures]]
provider = "slack"
name = "signed message event rejects stale signature"
kind = "webhook"
headers = { "content-type" = "application/json", "x-slack-request-timestamp" = "1713659999", "x-slack-signature" = "v0=900d7f33e65ec96e13d1f654e91a9cd0ce2b24ce036fde434835d2fcfd6c2def" }
metadata = { signing_secret = "event-secret", binding_id = "contract-slack-webhook", binding_version = 1, path = "/slack/events" }
body = '''{"token":"legacy-token","team_id":"T123","api_app_id":"A123","event":{"client_msg_id":"m-1","type":"message","text":"hello channel","user":"U111","ts":"1713650000.000100","team":"T123","channel":"C111","event_ts":"1713650000.000100","channel_type":"channel"},"type":"event_callback","event_id":"Ev-message-1","event_time":1713650000}'''
expect_type = "reject"
expect_response_status = 403
expect_event_count = 0

